[package]
name = "jagt"
version = "0.1.0"
edition = "2024"
description = "Deterministic renderer and validator for agentic Just task envelopes"
readme = "README.md"

[dependencies]
clap = { version = "4.5.40", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_yaml = "0.9.34"
thiserror = "2.0.12"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.20.0"
