[package]
name = "jagt"
version = "0.5.0"
edition = "2024"
license = "MIT"
description = "Deterministic renderer and validator for agentic Just task envelopes"
readme = "README.md"
repository = "https://github.com/rahuldave/jagt"
keywords = ["just", "agents", "cli", "yaml"]
categories = ["command-line-utilities", "development-tools"]
# Ship the crate only. The skills, hooks, fixtures and docs of this repository are not part of it.
include = ["/src", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[dependencies]
clap = { version = "4.5.40", features = ["derive"] }
getrandom = "0.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
sha2 = "0.10"
thiserror = "2.0.12"
toml = "0.8.23"
yaml-rust2 = { version = "0.13", default-features = false }

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.20.0"
