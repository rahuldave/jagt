# Builds the release binaries of jagt and publishes them with the GitHub release.
#
# jagt has no job that makes tags: a maintainer pushes each version tag, and a
# tag pushed by a person starts this workflow. To add the binaries to a tag
# that is already out, run the workflow by hand with that tag.
#
# A pull request that changes the build runs the binaries job too, without
# publishing, so the four builds are known to work before a tag needs them.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing version tag, such as v0.6.3"
        required: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml

permissions:
  contents: read

# Two runs for one tag, such as a tag push and a run by hand, must not mix the
# archive of one build with the hash of another, so they run one at a time.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  binaries:
    name: binaries (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            native: true
          # GitHub retired the macos-13 and macos-14 images, so the arm64
          # macos-latest runner builds this target. The binary cannot run there.
          - runner: macos-latest
            target: x86_64-apple-darwin
            native: false
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            native: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            native: true
    env:
      TARGET: ${{ matrix.target }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Check that the tag names the version in Cargo.toml
        if: github.event_name != 'pull_request'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$TAG" != "v$version" ]; then
            echo "the tag $TAG does not name version $version of Cargo.toml" >&2
            exit 1
          fi
      - name: Install the target
        run: rustup target add "$TARGET"
      - name: Install musl
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - name: Build
        run: cargo build --release --locked --target "$TARGET"
      - name: Check the binary
        run: |
          bin="target/$TARGET/release/jagt"
          file "$bin"
          case $TARGET in
            x86_64-*) file "$bin" | grep -E 'x86[-_]64' ;;
            aarch64-*) file "$bin" | grep -E 'arm64|aarch64' ;;
          esac
          if [ "$RUNNER_OS" = Linux ]; then
            file "$bin" | grep -E 'static(ally|-pie) linked'
          fi
          if [ "${{ matrix.native }}" = true ]; then
            "$bin" --version | grep -E '^jagt [0-9]+\.[0-9]+\.[0-9]+$'
          fi
      - name: Pack
        run: |
          asset="jagt-$TARGET.tar.gz"
          mkdir dist
          tar -czf "dist/$asset" -C "target/$TARGET/release" jagt
          (cd dist && shasum -a 256 "$asset" > "$asset.sha256" && cat "$asset.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: jagt-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: binaries
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: jagt-*
          merge-multiple: true
      - name: Check the assets
        run: |
          ls dist
          [ "$(ls dist/*.tar.gz | wc -l)" -eq 4 ]
          [ "$(ls dist/*.tar.gz.sha256 | wc -l)" -eq 4 ]
          (cd dist && shasum -a 256 -c ./*.sha256)
      - name: Publish the release and its assets
        run: |
          # A new release gets its assets in the same call, so the latest
          # release never shows without them.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            exit 0
          fi
          version=${TAG#v}
          awk -v head="## $version" '$0 == head { found = 1; next } /^## / { if (found) exit } found' \
            CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$TAG" dist/* --verify-tag --title "jagt $version" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --verify-tag --title "jagt $version" --notes-from-tag
          fi
